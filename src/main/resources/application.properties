# Server Configuration (Automatically reads Railway $PORT, defaults to 8080)
server.port=${PORT:8080}

# MongoDB Configuration:
# Automatically binds to any of Railway's exported MongoDB variables
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URL:${MONGO_PRIVATE_URL:${MONGO_PUBLIC_URL:${MONGODB_URL:${MONGODB_URI:mongodb://localhost:27017/expense_tracker}}}}}}

# Jackson Configuration for Date Handling
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.data.mongodb=INFO
