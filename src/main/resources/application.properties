# Spring Boot Server Configuration (Uses cloud platform $PORT if present, defaults to 8081)
server.port=${PORT:8081}

# MongoDB Configuration (Uses MongoDB Atlas $SPRING_DATA_MONGODB_URI in production, defaults to local)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/expense_tracker}

# Jackson Configuration for Date Handling
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.data.mongodb=INFO
