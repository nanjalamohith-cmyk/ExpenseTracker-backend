# Spring Boot Server Configuration (Configured to 8081 to avoid local conflict with PEMHTTPD)
server.port=8081

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/expense_tracker

# Jackson Configuration for Date Handling
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.data.mongodb=INFO
