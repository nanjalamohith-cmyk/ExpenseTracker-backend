# Server Configuration (Respects cloud PORT injected by Render/Railway, defaults to 8081 locally)
server.port=${PORT:8081}

# MongoDB Configuration:
# Automatically checks SPRING_DATA_MONGODB_URI, MONGO_URL (Railway standard), and MONGODB_URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/expense_tracker}}}

# Jackson Configuration for Date Handling
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.data.mongodb=INFO
